# Site-wide settings. Page content lives in _data/*.yml (see README.md).
# This file is not reloaded by `jekyll serve`; restart the server after editing it.

title: "Yiyu Li"
tagline: "Ph.D. Candidate in Computer Science, City University of Hong Kong"
description: >-
  Yiyu Li is a final-year Ph.D. candidate in Computer Science at the City University of Hong Kong,
  working on coding agents, world models, and video generation.
url: "https://yiyulics.github.io"
baseurl: ""
lang: "en"
theme: null   # no gem theme: layouts and styles live in this repository

# Google Scholar citation counts are crawled daily by .github/workflows/google_scholar_crawler.yaml
# into the `google-scholar-stats` branch of this repository and read by the page at runtime.
repository: "yiyulics/yiyulics.github.io"
google_scholar_stats_use_cdn: true

# Optional integrations; leave empty to disable.
google_analytics_id:
google_site_verification:
bing_site_verification:
baidu_site_verification:

timezone: Asia/Hong_Kong
encoding: "utf-8"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

include:
  - files
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - run_server.sh
  - scripts
  - google_scholar_crawler
  - crop.py
  - merge.py
  - resize.py
  - node_modules
  - vendor
  - .github
  # source images kept for crop.py / merge.py / resize.py, not used by any page (7 MB)
  - images/origin_sehdr.jpg
  - images/ours_lc_001_2.jpg
  - images/singlehdr_lc_001_2.jpg
  - images/500x300.png
  - images/pca_500x219.jpg
  - images/pca_500x300.jpg
  - images/avatar-android-chrome-512x512.png
