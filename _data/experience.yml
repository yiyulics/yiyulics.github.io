# Research experience, newest first.
# `focus` is the one-line summary that is always visible; `points` fold under "Details".
# `org_url`, `unit`, `location`, `mentors` and `points` are optional; `points` support Markdown.
# `logo` is optional: a square image in images/orgs/, shown in front of the organization's name.

- org: Alibaba Amap
  logo: /images/orgs/amap.png
  role: Research Intern
  focus: Post-training and distillation for autoregressive video generation; agentic video generation.
  period: 2026.03 – Present
  mentors:
    - name: Yong Wang
      url: https://scholar.google.com/citations?user=rAtlzLcAAAAJ&hl=zh-CN
    - name: Xiangxiang Chu
      url: https://cxxgtxy.github.io/
  points:
    - Research post-training methods for autoregressive video generation, using distribution matching distillation (DMD) to train few-step video diffusion models.
    - Developed Mass Forcing, which uses teacher-to-student density ratios to reweight distillation toward underrepresented modes.
    - Explore agentic approaches to video generation.

- org: Shanghai AI Laboratory
  logo: /images/orgs/shlab.png
  unit: Embodied AI Center
  role: Research Intern
  focus: Texture generation for a large-scale articulated-object generation project.
  period: 2025.06 – 2026.03
  location: Shanghai, China
  mentors:
    - name: Zhaoyang Lyu
      url: https://zhaoyanglyu.github.io/
    - name: Jiangmiao Pang
      url: https://oceanpang.github.io/
  points:
    - Led the texture generation component of a large-scale articulated-object generation project.
    - Investigated and evaluated state-of-the-art multiview-based and native texture generation methods.
    - Developed new generation approaches, including code-based representations and AR-based and dLLM-based texture generation.

- org: Huawei Hong Kong Research Center
  logo: /images/orgs/huawei.png
  unit: 2012 Laboratories
  role: Research Intern
  focus: Touch-event prediction and neural texture compression for mobile games on HarmonyOS.
  period: 2024.12 – 2025.06
  location: Hong Kong
  mentors:
    - name: Lin Koon Wing Macgyver
      url: https://www.linkedin.com/in/mac-lin-5194b718/
  points:
    - Improved the performance of games (FPS, MOBA, RPG) on HarmonyOS by predicting touch events, reducing end-to-end latency by 6 to 20 ms.
    - Reduced game package size by compressing textures and light maps with grid-based neural implicit compression, achieving a 60% higher compression ratio than conventional ASTC.

