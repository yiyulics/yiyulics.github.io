# One paragraph per item. Markdown is supported.
bio:
  - >-
    I am a final-year Ph.D. candidate in Computer Science at the
    [City University of Hong Kong](https://www.cityu.edu.hk/), co-supervised by
    Prof. [Rynson W.H. Lau](https://www.cs.cityu.edu.hk/~rynson/) and
    Prof. [Gerhard Petrus Hancke](https://scholars.cityu.edu.hk/en/persons/gerhard-petrus-hancke).
    My current research focuses on Sim2Real2Sim, world models, and video generation.
  - >-
    I am exploring code-based world models that represent scenes and their evolution in code,
    as well as coding agents that write and execute code to generate videos and other visual content.
    My previous work spans 3D generation, texture synthesis, 3D reconstruction, and image enhancement.
    I am currently a research intern at Alibaba Amap, and I received my B.Eng. from
    Harbin Institute of Technology.

# Highlighted note under the bio. Delete the whole `status` block to hide it.
