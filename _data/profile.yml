# ---- Hero (top of the page) ----
hero:
  # \u00A0 is a non-breaking space: it keeps "in 3D" and "in code" from splitting across lines.
  tagline: "I study how machines can model the visual world, in\u00A0pixels, in\u00A03D, and increasingly in\u00A0code."
  intro: >-
    I currently work on coding agents and world models for video generation: programs that represent
    a scene and how it evolves, and agents that write and run that code to produce video.
  demo: true                         # the interactive "world.py" figure; set to false to hide it
  style: ascii                       # first renderer in the hero

# Small highlighted note in the hero and in the contact section. Delete the block to hide it.
status:
  label: On the job market
  text: Graduating in August 2027. Open to industry research roles and academic positions (postdoc / faculty).

# ---- About ----  One paragraph per item. Markdown is supported.
about:
  - >-
    I am a final-year Ph.D. candidate in Computer Science at the
    [City University of Hong Kong](https://www.cityu.edu.hk/), co-supervised by
    Prof. [Rynson W.H. Lau](https://www.cs.cityu.edu.hk/~rynson/) and
    Prof. [Gerhard Petrus Hancke](https://scholars.cityu.edu.hk/en/persons/gerhard-petrus-hancke).
    Before that, I received my B.Eng. from Harbin Institute of Technology.
  - >-
    My current focus is coding agents for video generation. I study how agents can write and run
    programs that describe a scene and how it changes over time.
    My previous work spans 3D generation, texture synthesis, 3D reconstruction, and image enhancement.
  - >-
    Alongside my Ph.D., I have worked in [industry research labs](#experience). I am currently a
    research intern at Alibaba Amap, working on autoregressive video generation. Before that, I led
    texture generation for an articulated-object project at Shanghai AI Laboratory, and worked on
    neural texture compression at Huawei.

